# Puts the gallery/ folder on GitHub Pages whenever it changes on main (gallery/README.md).
name: Gallery

on:
  push:
    branches: [main]
    paths: ['gallery/**', '.github/workflows/gallery.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gallery
      - id: deployment
        uses: actions/deploy-pages@v4
